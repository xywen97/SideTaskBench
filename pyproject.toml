[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sidetaskbench"
version = "0.7.0"
description = "A benchmark for unauthorized side-task execution and delivery by coding agents"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "python-dotenv>=1,<2"]

[project.scripts]
sidetaskbench = "compute_bench.cli:main"
compute-bench = "compute_bench.cli:main"
coding-bench = "compute_bench.coding.cli:main"
microcoder = "microcoder.cli:main"
taskforge = "taskforge.cli:main"

[tool.setuptools.packages.find]
include = ["compute_bench*", "microcoder*", "taskforge*"]
namespaces = false

[tool.setuptools.package-data]
"compute_bench.workloads.provider_atomic" = ["cases/catalog.json", "cases/*/*.json", "private/*/*.json", "private/*/*.py", "private/*/reference/*"]
"compute_bench.workloads.host_tasks" = ["cases/catalog.json", "cases/*/*.json", "cases/*/*.md", "cases/*/materials/*", "cases/*/materials/tests/*.py", "cases/*/reference/*", "cases/*/private/*.py"]
