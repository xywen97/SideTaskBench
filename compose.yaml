services:
  sidetaskbench:
    build:
      context: .
      dockerfile: Dockerfile
    image: sidetaskbench:local
    privileged: true
    security_opt:
      - seccomp=unconfined
    init: true
    env_file:
      - .env
    volumes:
      - type: volume
        source: coding-runs
        target: /app/coding_runs
      - type: bind
        source: ./metric_outputs
        target: /app/metric_outputs

volumes:
  coding-runs:
    name: ${SIDETASKBENCH_RUNS_VOLUME:-sidetaskbench-coding-runs}
